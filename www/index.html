<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grimms Time Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <meta name="theme-color" content="#020617" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <div id="intro-overlay" class="intro-overlay">
    <div class="intro-content">
      <img src="logo1.png" alt="Grimms Logo" class="intro-logo" />
      <div class="intro-glow"></div>
      <p class="intro-signature">— Grimm Kreations</p>
    </div>
  </div>

  <div class="app-shell">
    <header>
      <div class="logo-wrap">
        <img src="logo.png" class="logo" alt="Grimms Time Tracker" />
      </div>
      <p class="tagline">Trackin' your Slackin'</p>
    </header>

    <main>
      <section class="card">
        <div class="new-entry-header">
          <h2>New Entry</h2>
          <button type="button" id="default-time-btn" class="default-time-btn">
            Default: 9:00 AM
          </button>
        </div>

        <form id="time-form">
          <div class="field-row">
            <label>
              Date
              <div class="date-nav-row">
                <button type="button" id="date-prev" class="secondary icon-nav-btn" aria-label="Previous day">‹</button>
                <button type="button" id="date" class="start-display time-display-button">MM/DD/YYYY</button>
                <button type="button" id="date-next" class="secondary icon-nav-btn" aria-label="Next day">›</button>
              </div>
            </label>

            <label>
              Start
              <button type="button" id="start-display" class="start-display time-display-button">--:--</button>
            </label>

            <label>
              End
              <button type="button" id="end-display" class="start-display time-display-button">--:--</button>
            </label>
          </div>

          <label class="full-width">
            What did you work on?
            <textarea id="description" rows="2" placeholder="Math, reading, break, etc." required></textarea>
          </label>

          <div class="actions">
            <button type="submit">Add Entry</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>Logged Time</h2>
          <div class="card-tools">
            <label class="filter-label">
              Filter by date
              <button type="button" id="filter-date" class="start-display time-display-button">All dates</button>
            </label>
            <button type="button" id="clear-filter" class="secondary small">Clear Filter</button>
          </div>
        </div>

        <div class="summary-row">
          <span id="entry-count">0 entries</span>
          <span id="total-time">Total: 0h 0m</span>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Duration</th>
                <th>What you did</th>
              </tr>
            </thead>
            <tbody id="entries-body"></tbody>
          </table>
        </div>

        <p class="tap-hint">Tap a row to view, edit, or delete it.</p>
      </section>

      <div class="page-end-actions">
        <button type="button" id="clear-all" class="secondary">Clear All</button>
      </div>
    </main>

    <footer>
      <small>All data is stored locally in this browser.</small>
    </footer>
  </div>

  <div id="entry-modal" class="modal hidden">
    <div id="modal-backdrop" class="modal-backdrop"></div>
    <div class="modal-dialog">
      <h3>Entry details</h3>
      <p id="modal-date" class="modal-meta"></p>
      <p id="modal-time" class="modal-meta"></p>
      <p id="modal-duration" class="modal-meta strong"></p>

      <label class="modal-label">
        Description
        <textarea id="modal-description" rows="3"></textarea>
      </label>

      <label class="modal-label">
        Start time
        <button type="button" id="modal-start-display" class="start-display time-display-button">--:--</button>
      </label>

      <label class="modal-label">
        End time
        <button type="button" id="modal-end-display" class="start-display time-display-button">--:--</button>
      </label>

      <div class="modal-actions">
        <button type="button" id="modal-save">Save</button>
        <button type="button" id="modal-delete" class="secondary">Delete</button>
        <button type="button" id="modal-close" class="secondary">Close</button>
      </div>
    </div>
  </div>

  <div id="time-picker-modal" class="modal hidden">
    <div id="time-picker-backdrop" class="modal-backdrop"></div>
    <div class="modal-dialog time-picker-dialog">
      <h3 id="time-picker-title">Choose time</h3>

      <div class="time-picker-grid">
        <div class="time-picker-col">
          <button type="button" id="tp-hour-up" class="secondary small">▲</button>
          <div id="tp-hour-display" class="time-picker-value">9</div>
          <button type="button" id="tp-hour-down" class="secondary small">▼</button>
        </div>

        <div class="time-picker-sep">:</div>

        <div class="time-picker-col">
          <button type="button" id="tp-minute-up" class="secondary small">▲</button>
          <div id="tp-minute-display" class="time-picker-value">00</div>
          <button type="button" id="tp-minute-down" class="secondary small">▼</button>
        </div>

        <div class="time-picker-col">
          <button type="button" id="tp-ampm-toggle" class="secondary">AM</button>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" id="time-picker-apply">Apply</button>
        <button type="button" id="time-picker-cancel" class="secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div id="calendar-modal" class="modal hidden">
    <div id="calendar-backdrop" class="modal-backdrop"></div>
    <div class="modal-dialog calendar-dialog">
      <div class="calendar-header">
        <button type="button" id="calendar-prev" class="secondary small">‹</button>
        <div id="calendar-title" class="calendar-title">March 2026</div>
        <button type="button" id="calendar-next" class="secondary small">›</button>
      </div>

      <div class="calendar-weekdays">
        <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
      </div>

      <div id="calendar-grid" class="calendar-grid"></div>

      <div class="modal-actions">
        <button type="button" id="calendar-clear" class="secondary">Clear</button>
        <button type="button" id="calendar-cancel" class="secondary">Cancel</button>
        <button type="button" id="calendar-apply">Apply</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const placeholders = [
      "This better be worth my time.",
      "Saving the world, one task at a time.",
      "Make it look like you tried.",
      "Let's pretend this is productive."
    ];

    let index = localStorage.getItem("placeholderIndex");
    index = index ? parseInt(index, 10) : 0;

    const nextIndex = (index + 1) % placeholders.length;
    localStorage.setItem("placeholderIndex", nextIndex);

    window.addEventListener("DOMContentLoaded", () => {
      const textarea = document.getElementById("description");
      if (textarea) {
        textarea.placeholder = placeholders[index];
      }
    });
  </script>
</body>
</html>
